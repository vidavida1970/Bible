<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d372f" />
  <meta name="description" content="로마서 12장 1절 오늘의 말씀 묵상" />
  <meta property="og:title" content="오늘의 말씀 | 로마서 12:1" />
  <meta property="og:description" content="여러분의 몸을 하나님께서 기뻐하실 거룩한 산 제물로 드리십시오." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1759150954334-12167651fa60?auto=format&fit=crop&w=2400&q=85" />
  <title>오늘의 말씀 | 로마서 12:1</title>
  <style>
    :root { --white:#fff; --ivory:#fff4d3; --glass-dark:rgba(20,28,24,.82); --line:rgba(255,255,255,.24); --gold:#f0d99c; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--white); background:#26332c; font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
    .page { position:relative; min-height:100vh; overflow:hidden; padding:56px 20px 72px; background:linear-gradient(180deg,rgba(16,21,18,.25) 0%,rgba(16,21,18,.40) 50%,rgba(16,21,18,.74) 100%),url("https://images.unsplash.com/photo-1759150954334-12167651fa60?auto=format&fit=crop&w=2400&q=85") center center/cover no-repeat fixed; }
    .page::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 76% 18%,rgba(255,217,139,.18),transparent 27%),linear-gradient(90deg,rgba(18,25,21,.30),transparent 48%,rgba(18,25,21,.18)); pointer-events:none; }
    .shell { position:relative; z-index:1; width:min(980px,100%); margin:0 auto; display:grid; gap:28px; }
    .verse-card { padding:clamp(38px,6vw,74px); border-radius:34px; background:linear-gradient(145deg,rgba(26,37,31,.73),rgba(33,38,31,.46)); border:1px solid var(--line); box-shadow:0 30px 90px rgba(0,0,0,.30); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); text-align:center; }
    .date { margin:0 0 10px; font-size:13px; font-weight:700; letter-spacing:.14em; color:rgba(255,255,255,.72); }
    .label { margin:0 0 28px; color:var(--gold); font-size:14px; font-weight:800; letter-spacing:.20em; }
    blockquote { margin:0; font-family:"Noto Serif KR","Nanum Myeongjo",serif; font-size:clamp(25px,4.05vw,42px); line-height:1.68; font-weight:700; letter-spacing:-.04em; word-break:keep-all; text-shadow:0 4px 24px rgba(0,0,0,.62); }
    .emphasis { color:var(--ivory); }
    .reference { margin-top:30px; font-size:clamp(16px,2vw,20px); font-weight:800; letter-spacing:.03em; color:rgba(255,255,255,.95); }
    .video-card { padding:22px; border-radius:28px; background:var(--glass-dark); border:1px solid var(--line); box-shadow:0 24px 72px rgba(0,0,0,.30); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .video-heading { display:flex; align-items:center; gap:10px; margin:0 0 16px; font-size:17px; font-weight:800; }
    .play-icon { width:32px; height:32px; display:inline-grid; place-items:center; border-radius:50%; background:#fff; color:#27352e; font-size:12px; flex:0 0 auto; }
    .video-wrap { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:20px; background:#000; box-shadow:0 16px 40px rgba(0,0,0,.30); }
    .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .fallback { margin:14px 0 0; color:rgba(255,255,255,.74); font-size:13px; line-height:1.6; }
    .watch-button { display:inline-flex; align-items:center; justify-content:center; min-height:46px; margin-top:12px; padding:0 20px; border-radius:999px; background:#fff; color:#26352e; text-decoration:none; font-size:14px; font-weight:800; box-shadow:0 8px 26px rgba(0,0,0,.18); }
    .credit { margin:0; text-align:center; font-size:12px; line-height:1.6; color:rgba(255,255,255,.66); }
    .credit a { color:rgba(255,255,255,.88); }
    @media (max-width:700px) { .page { padding:28px 14px 42px; background-attachment:scroll; } .shell { gap:18px; } .verse-card { padding:34px 22px; border-radius:25px; } blockquote { line-height:1.62; } .video-card { padding:14px; border-radius:22px; } .video-wrap { border-radius:15px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="verse-card" aria-label="오늘의 말씀">
        <p class="date">2026-07-29</p>
        <p class="label">TODAY'S WORD · 오늘의 말씀</p>
        <blockquote>
          “형제자매 여러분, 그러므로 나는 하나님의 자비하심을 힘입어 여러분에게 권합니다.<br>
          <span class="emphasis">여러분의 몸을 하나님께서 기뻐하실 거룩한 산 제물로 드리십시오.</span><br>
          이것이 여러분이 드릴 합당한 예배입니다.”
        </blockquote>
        <div class="reference">로마서 12:1</div>
      </section>
      <section class="video-card" aria-label="말씀 묵상 영상">
        <h2 class="video-heading"><span class="play-icon">▶</span>말씀과 함께 영상 보기</h2>
        <div class="video-wrap">
          <iframe src="https://www.youtube-nocookie.com/embed/piY_uUrJqB8?rel=0&playsinline=1" title="로마서 12장 1절 말씀 묵상 영상" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <p class="fallback">브라우저 환경에서 임베드 재생이 제한될 경우 아래 버튼으로 YouTube 영상을 바로 열 수 있습니다.</p>
        <a class="watch-button" href="https://youtu.be/piY_uUrJqB8?si=HAOUY5cHwicDfY3C" target="_blank" rel="noopener noreferrer">▶ YouTube에서 바로 보기</a>
      </section>
      <p class="credit">Background photo: <a href="https://unsplash.com/photos/rolling-hills-and-mountains-at-sunrise-with-a-path-aBHB6WoVwrQ" target="_blank" rel="noopener noreferrer">Lorenzo Berti / Unsplash</a></p>
    </div>
  </main>
</body>
</html>
