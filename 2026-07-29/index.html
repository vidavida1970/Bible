  <title>오늘의 말씀 | 로마서 12:1</title>

  <style>
    :root {
      --gold: #f4d386;
      --gold-light: #fff5d6;
      --cream: #fbf9f4;
      --deep-bg: #141c17;
      --glass-bg: rgba(22, 34, 27, 0.72);
      --glass-border: rgba(255, 255, 255, 0.22);
      --shadow-color: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--deep-bg);
      color: var(--cream);
      overflow-x: hidden;
    }

    /* Hero Background with High Readability Overlay */
    .page-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background-image:
        linear-gradient(180deg, rgba(13, 22, 17, 0.35) 0%, rgba(13, 22, 17, 0.65) 60%, rgba(13, 22, 17, 0.88) 100%),
        url("bg.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .page-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 215, 130, 0.20), transparent 45%),
        linear-gradient(90deg, rgba(12, 18, 14, 0.25), transparent 50%, rgba(12, 18, 14, 0.25));
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(940px, 100%);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Scripture Verse Card */
    .verse-card {
      padding: clamp(38px, 6vw, 68px);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(23, 37, 29, 0.78), rgba(28, 44, 35, 0.55));
      border: 1px solid var(--glass-border);
      box-shadow: 0 32px 80px var(--shadow-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .verse-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
    }

    .date-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(244, 211, 134, 0.15);
      border: 1px solid rgba(244, 211, 134, 0.3);
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .eyebrow {
      margin-bottom: 28px;
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2em;
      opacity: 0.9;
    }

    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(23px, 3.8vw, 38px);
      line-height: 1.72;
      font-weight: 700;
      letter-spacing: -0.03em;
      word-break: keep-all;
      text-wrap: balance;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
      color: #ffffff;
    }

    blockquote .highlight {
      color: var(--gold-light);
      position: relative;
      display: inline-block;
    }

    .reference {
      margin-top: 32px;
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Video Embed Card */
    .video-card {
      padding: clamp(20px, 4vw, 28px);
      border-radius: 28px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 24px 64px var(--shadow-color);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .video-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .play-icon {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--gold);
      color: #17241c;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(244, 211, 134, 0.35);
      flex-shrink: 0;
    }

    .video-title {
      font-size: clamp(16px, 2vw, 19px);
      font-weight: 800;
      color: var(--cream);
      letter-spacing: -0.01em;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-footer {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .fallback-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
    }

    .youtube-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #ffffff;
      color: #1a251e;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .youtube-btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    /* Footer Credit */
    .credit {
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.6;
      margin-top: 8px;
    }

    /* Responsive adjustments */
    @media (max-width: 700px) {
      .page-wrapper {
        padding: 32px 14px 48px;
        background-attachment: scroll;
      }
      .container {
        gap: 22px;
      }
      .verse-card {
        padding: 32px 20px;
        border-radius: 24px;
      }
      blockquote {
        font-size: clamp(20px, 5.6vw, 28px);
        line-height: 1.62;
      }
      .video-card {
        padding: 16px;
        border-radius: 22px;
      }
      .video-container {
        border-radius: 16px;
      }
      .video-footer {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .youtube-btn {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page-wrapper">
    <div class="container">
      
      <!-- Verse Section -->
      <section class="verse-card" aria-label="오늘의 말씀 묵상 카드">
        <div class="date-badge">2026-07-29</div>
        <p class="eyebrow">TODAY'S BIBLE VERSE · 오늘의 말씀</p>
        <blockquote>
          “형제자매 여러분, 그러므로 나는 하나님의 자비하심을 힘입어 여러분에게 권합니다.<br>
          <span class="highlight">여러분의 몸을 하나님께서 기뻐하실 거룩한 산 제물로 드리십시오.</span><br>
          이것이 여러분이 드릴 합당한 예배입니다.”
        </blockquote>
        <div class="reference">로마서 12:1</div>
      </section>

      <!-- Video Section -->
      <section class="video-card" aria-label="관련 말씀 묵상 영상">
        <div class="video-header">
          <span class="play-icon">▶</span>
          <h2 class="video-title">로마서 12:1 말씀 영상 함께 보기</h2>
        </div>
        
        <div class="video-container">
          <iframe
            src="https://www.youtube-nocookie.com/embed/piY_uUrJqB8?rel=0&playsinline=1"
            title="로마서 12장 1절 말씀 영상"
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <div class="video-footer">
          <p class="fallback-text">모바일 및 브라우저 설정으로 영상을 직접 재생할 수 없는 경우 YouTube 앱/웹으로 직접 시청하실 수 있습니다.</p>
          <a class="youtube-btn" href="https://youtu.be/piY_uUrJqB8?si=HAOUY5cHwicDfY3C" target="_blank" rel="noopener noreferrer">
            ▶ YouTube에서 영상 보기
          </a>
        </div>
      </section>

      <p class="credit">오늘의 말씀 배경화면 | 2026-07-29</p>

    </div>
  </main>
</body>
