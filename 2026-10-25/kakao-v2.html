<h1>그분 안에 뿌리를 박고</h1>
<p class="subtitle">믿음을 굳게 하여 감사의 마음이 넘치게</p>
<article class="verse-card" aria-label="골로새서 2장 6절부터 7절 오늘의 말씀"><div class="star" aria-hidden="true">✦</div>
<div class="verse"><p>“<span class="highlight">그러므로 여러분이 그리스도 예수를 주님으로 받아들였으니, 그분 안에서 살아가십시오.</span> 여러분은 <span class="highlight">그분 안에 뿌리를 박고, 세우심을 입어서,</span> 가르침을 받은 대로 믿음을 굳게 하여 <span class="highlight">감사의 마음이 넘치게 하십시오.</span>”</p></div>
<p class="reference">— 골로새서 2:6–7 —</p></article>
