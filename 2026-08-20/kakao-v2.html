      <blockquote>
        “아이들아, 내 말을 지키고, 내 명령을 너의 마음 속 깊이 간직하여라.<br><br>
        내 명령을 지켜서 잘 살고 <span class="highlight">내 교훈을 너의 눈동자를 보호하듯 지켜라.</span><br><br>
        그것을 너의 손가락에 매고, <span class="highlight">네 마음 속 깊이 새겨 두어라.</span><br><br>
        지혜에게는 “너는 내 누이”라고 말하고, <span class="highlight">명철에게는 “너는 내 친구”라고 불러라.</span>”
      </blockquote>
