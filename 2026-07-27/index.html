  <title>오늘의 말씀 | 시편 37:3-5</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #fbfff9;
      --gold: #f3d69a;
      --forest: #17352d;
      --deep: #07140f;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: var(--deep);
      color: var(--ink);
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      min-height: 690px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px 58px;
      overflow: hidden;
      background-image:
        linear-gradient(180deg, rgba(4, 16, 12, .22), rgba(5, 18, 13, .68)),
        url("https://images.pexels.com/photos/32553337/pexels-photo-32553337.jpeg?auto=compress&cs=tinysrgb&w=2000");
      background-size: cover;
      background-position: center 64%;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 14%, rgba(255, 223, 157, .24), transparent 28%),
        linear-gradient(90deg, rgba(4, 15, 11, .20), transparent 52%, rgba(4, 15, 11, .14));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
    }

    .verse-card {
      padding: clamp(34px, 5.4vw, 62px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(18, 50, 40, .78), rgba(20, 39, 31, .50));
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .22em;
    }

    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(23px, 3.5vw, 39px);
      line-height: 1.64;
      font-weight: 700;
      letter-spacing: -.035em;
      word-break: keep-all;
      text-wrap: balance;
      text-shadow: 0 4px 24px rgba(0,0,0,.72);
    }

    .reference {
      margin-top: 26px;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 800;
      color: rgba(255,255,255,.95);
    }

    .video-section {
      padding: 34px 20px 72px;
      background:
        radial-gradient(circle at 50% 0%, rgba(72, 118, 96, .22), transparent 40%),
        var(--deep);
    }

    .video-card {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 22px;
      border-radius: 28px;
      background: rgba(15, 38, 30, .95);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .video-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 800;
    }

    .play {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #1d4538;
      font-size: 12px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255,255,255,.73);
    }

    .watch-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      background: #fff;
      color: #1a4034;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .credit {
      width: min(980px, 100%);
      margin: 18px auto 0;
      text-align: center;
      color: rgba(255,255,255,.56);
      font-size: 12px;
      line-height: 1.6;
    }

    .credit a { color: rgba(255,255,255,.78); }

    @media (max-width: 700px) {
      .hero {
        min-height: auto;
        padding: 28px 14px 38px;
        background-position: 56% center;
      }

      .verse-card {
        padding: 32px 20px;
        border-radius: 25px;
      }

      blockquote {
        font-size: clamp(21px, 6.2vw, 30px);
        line-height: 1.58;
      }

      .video-section { padding: 20px 14px 44px; }
      .video-card { padding: 14px; border-radius: 22px; }
      .video-wrap { border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="오늘의 말씀">
      <div class="content">
        <article class="verse-card">
          <p class="eyebrow">TODAY'S WORD · 오늘의 말씀</p>
          <blockquote>
            “주님만 의지하고, 선을 행하여라.<br>
            이 땅에서 사는 동안 성실히 살아라.<br>
            기쁨은 오직 주님에게서 찾아라.<br>
            주님께서 네 마음의 소원을 들어주신다.<br>
            네 갈 길을 주님께 맡기고, 주님만 의지하여라.<br>
            주님께서 이루어 주실 것이다.”
          </blockquote>
          <div class="reference">시편 37:3-5</div>
        </article>
      </div>
    </section>

    <section class="video-section" aria-label="말씀 묵상 영상">
      <article class="video-card">
        <h2 class="video-title"><span class="play">▶</span>말씀과 함께 영상 보기</h2>
        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/8szyv1G9h9w?rel=0&playsinline=1"
            title="시편 37장 3절부터 5절 말씀 묵상 영상"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
        <p class="fallback">브라우저 환경에 따라 영상 재생이 제한될 경우 아래 버튼으로 바로 시청할 수 있습니다.</p>
        <a class="watch-button" href="https://youtu.be/8szyv1G9h9w" target="_blank" rel="noopener noreferrer">▶ YouTube에서 바로 보기</a>
      </article>

      <p class="credit">Background photo: <a href="https://www.pexels.com/photo/serene-forest-path-with-trees-at-sunrise-32553337/" target="_blank" rel="noopener noreferrer">Ayşe Demir / Pexels</a></p>
    </section>
  </main>
</body>
