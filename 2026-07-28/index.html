  <title>오늘의 말씀 | 신명기 6:4-6</title>

  <style>
    * { box-sizing: border-box; }
    :root {
      --cream: #fffaf0;
      --gold: #f0d99a;
      --deep: #13231d;
      --forest: #1f3b30;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: var(--deep);
      color: var(--cream);
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      min-height: 700px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 54px 20px 62px;
      overflow: hidden;
      background-image:
        linear-gradient(180deg, rgba(10, 25, 20, .22), rgba(9, 24, 18, .64)),
        url("https://images.pexels.com/photos/33959017/pexels-photo-33959017.jpeg?auto=compress&cs=tinysrgb&w=2000");
      background-size: cover;
      background-position: center 48%;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 58% 14%, rgba(255, 224, 151, .30), transparent 30%),
        linear-gradient(90deg, rgba(8, 21, 16, .14), transparent 46%, rgba(8, 21, 16, .16));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
    }

    .verse-card {
      padding: clamp(34px, 5.6vw, 66px);
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.25);
      background: linear-gradient(145deg, rgba(23, 53, 42, .78), rgba(20, 40, 32, .48));
      box-shadow: 0 30px 90px rgba(0,0,0,.34);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .22em;
    }

    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(23px, 3.55vw, 40px);
      line-height: 1.66;
      font-weight: 700;
      letter-spacing: -.035em;
      word-break: keep-all;
      text-wrap: balance;
      text-shadow: 0 4px 24px rgba(0,0,0,.72);
    }

    .reference {
      margin-top: 28px;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 800;
      color: rgba(255,255,255,.96);
    }

    .video-section {
      padding: 34px 20px 72px;
      background:
        radial-gradient(circle at 50% 0%, rgba(59, 91, 73, .20), transparent 42%),
        var(--deep);
    }

    .video-card {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 22px;
      border-radius: 28px;
      background: rgba(20, 42, 33, .95);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .video-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 800;
    }

    .play {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #244838;
      font-size: 12px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255,255,255,.73);
    }

    .watch-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      background: #fff;
      color: #234535;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .credit {
      width: min(980px, 100%);
      margin: 18px auto 0;
      text-align: center;
      color: rgba(255,255,255,.56);
      font-size: 12px;
      line-height: 1.6;
    }

    .credit a { color: rgba(255,255,255,.80); }

    @media (max-width: 700px) {
      .hero { min-height: auto; padding: 28px 14px 38px; background-position: 53% center; }
      .verse-card { padding: 32px 20px; border-radius: 25px; }
      blockquote { font-size: clamp(21px, 6.1vw, 30px); line-height: 1.58; }
      .video-section { padding: 20px 14px 44px; }
      .video-card { padding: 14px; border-radius: 22px; }
      .video-wrap { border-radius: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="오늘의 말씀">
      <div class="content">
        <article class="verse-card">
          <p class="eyebrow">TODAY'S WORD · 오늘의 말씀</p>
          <blockquote>
            “이스라엘은 들으십시오.<br>
            주님은 우리의 하나님이시요, 주님은 오직 한 분뿐이십니다.<br><br>
            당신들은 마음을 다하고 뜻을 다하고 힘을 다하여,<br>
            주 당신들의 하나님을 사랑하십시오.<br><br>
            내가 오늘 당신들에게 명하는 이 말씀을 마음에 새기고,”
          </blockquote>
          <div class="reference">신명기 6:4-6</div>
        </article>
      </div>
    </section>

    <section class="video-section" aria-label="말씀 묵상 영상">
      <article class="video-card">
        <h2 class="video-title"><span class="play">▶</span>말씀과 함께 영상 보기</h2>
        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/ZhkhL2tKTF4?rel=0&playsinline=1"
            title="신명기 6장 4절부터 6절 말씀 묵상 영상"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
        <p class="fallback">브라우저 환경에 따라 영상 재생이 제한될 경우 아래 버튼으로 바로 시청할 수 있습니다.</p>
        <a class="watch-button" href="https://youtu.be/ZhkhL2tKTF4?si=75ZRhT1VY23Rx00S" target="_blank" rel="noopener noreferrer">▶ YouTube에서 바로 보기</a>
      </article>

      <p class="credit">Background photo: <a href="https://www.pexels.com/photo/tranquil-pathway-with-mountain-view-at-sunrise-33959017/" target="_blank" rel="noopener noreferrer">Denis Mustafaev / Pexels</a></p>
    </section>
  </main>
</body>
