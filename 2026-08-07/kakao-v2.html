<body><main class="page"><div class="shell"><section class="verse"><p class="date">2026년 8월 7일 금요일</p><p class="label">TODAY'S WORD · 오늘의 말씀</p><blockquote>“내 아이들아, 꿀을 먹어라. 그것은 좋은 것이다. 송이꿀을 먹어라. 그것은 너의 입에 달콤할 것이다.<br><br>지혜도 너의 영혼에게는 그와 같다는 것을 알아라. 그것을 얻으면 너의 장래가 밝아지고, 너의 소망이 끊어지지 않는다.”</blockquote><div class="ref">잠언 24:13-14</div></section><section class="video"><div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/jwsbcM1rOFE?rel=0&amp;playsinline=1" title="잠언 24:13-14 말씀 묵상 영상" allowfullscreen></iframe></div><a class="watch" href="https://youtu.be/jwsbcM1rOFE" target="_blank" rel="noopener noreferrer">▶ YouTube에서 바로 보기</a></section></div></main></body>
