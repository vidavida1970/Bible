  <title>오늘의 말씀 | 새 힘을 얻으리니</title>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #26332c;
      color: #fff;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }
    .page {
      min-height: 100vh;
      position: relative;
      padding: 56px 20px 72px;
      background:
        linear-gradient(180deg, rgba(10,25,22,.20), rgba(10,25,22,.72)),
        url("assets/background.jpg") center/cover no-repeat fixed;
    }
    .shell {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }
    .verse-card, .video-card {
      border: 1px solid rgba(255,255,255,.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 28px 80px rgba(0,0,0,.28);
    }
    .verse-card {
      padding: clamp(36px, 6vw, 72px);
      border-radius: 34px;
      background: rgba(18,44,39,.62);
      text-align: center;
    }
    .date {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: .14em;
      color: rgba(255,255,255,.72);
    }
    .label {
      margin: 0 0 26px;
      color: #f0d99c;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .20em;
    }
    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.65;
      font-weight: 700;
      letter-spacing: -.04em;
      word-break: keep-all;
      text-shadow: 0 4px 24px rgba(0,0,0,.58);
    }
    .reference {
      margin-top: 28px;
      font-size: 19px;
      font-weight: 800;
    }
    .video-card {
      padding: 22px;
      border-radius: 28px;
      background: rgba(14,34,30,.82);
    }
    .video-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 17px;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .watch-button {
      display: inline-flex;
      margin-top: 14px;
      min-height: 46px;
      align-items: center;
      padding: 0 20px;
      border-radius: 999px;
      background: #fff;
      color: #183a35;
      text-decoration: none;
      font-weight: 800;
    }
    .credit {
      margin: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,.68);
    }
    .credit a { color: rgba(255,255,255,.88); }

    @media (max-width: 700px) {
      .page { padding: 28px 14px 42px; background-attachment: scroll; }
      .verse-card { padding: 34px 22px; border-radius: 25px; }
      .video-card { padding: 14px; border-radius: 22px; }
      blockquote { line-height: 1.6; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <section class="verse-card">
        <p class="date">2026년 8월 1일</p>
        <p class="label">TODAY'S WORD · 오늘의 말씀</p>
        <blockquote>오직 주님을 소망으로 삼는 사람은 새 힘을 얻으리니,<br>독수리가 날개를 치며 솟아오르듯 올라갈 것이요,<br>뛰어도 지치지 않으며,<br>걸어도 피곤하지 않을 것이다.</blockquote>
        <div class="reference">이사야서 40:31</div>
      </section>

      <section class="video-card">
        <h2 class="video-heading">▶ 말씀과 함께 영상 보기</h2>

        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/KO7FUhReZ0I?rel=0&playsinline=1"
            title="이사야서 40:31 말씀 묵상 영상"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <a class="watch-button"
           href="https://www.youtube.com/watch?v=KO7FUhReZ0I"
           target="_blank"
           rel="noopener noreferrer">
          ▶ YouTube에서 바로 보기
        </a>
      </section>

      <p class="credit">
        Background photo:
        <a href="https://unsplash.com/photos/bird-flying-above-body-of-water-and-glacier-mountains-at-the-distance-cgYpPlPmsUM" target="_blank" rel="noopener noreferrer">
          Ronald Diel · Unsplash
        </a>
      </p>
    </div>
  </main>
</body>
</html>
