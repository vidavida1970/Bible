  <title>오늘의 말씀 · 시편 52:8-9</title>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1f3428;
      color: #fff;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }
    .page {
      min-height: 100vh;
      position: relative;
      padding: 56px 20px 72px;
      background:
        linear-gradient(180deg, rgba(9,25,17,.28), rgba(9,25,17,.80)),
        url("assets/background.jpg") center/cover no-repeat fixed;
    }
    .shell {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }
    .verse-card, .video-card {
      border: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 28px 80px rgba(0,0,0,.32);
    }
    .verse-card {
      padding: clamp(36px, 6vw, 72px);
      border-radius: 34px;
      background: rgba(18,45,31,.68);
      text-align: center;
    }
    .date {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: .14em;
      color: rgba(255,255,255,.76);
    }
    .label {
      margin: 0 0 26px;
      color: #e4eda8;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(24px, 3.7vw, 40px);
      line-height: 1.68;
      font-weight: 700;
      letter-spacing: -.04em;
      word-break: keep-all;
      text-shadow: 0 4px 24px rgba(0,0,0,.62);
    }
    .reference {
      margin-top: 28px;
      color: #f0f5dd;
      font-size: 19px;
      font-weight: 800;
    }
    .video-card {
      padding: 22px;
      border-radius: 28px;
      background: rgba(13,34,23,.88);
    }
    .video-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 17px;
    }
    .video-title {
      margin: -7px 0 18px;
      color: rgba(255,255,255,.72);
      font-size: 14px;
      line-height: 1.6;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .watch-button {
      display: inline-flex;
      margin-top: 14px;
      min-height: 46px;
      align-items: center;
      padding: 0 20px;
      border-radius: 999px;
      background: #f4f6ee;
      color: #183a26;
      text-decoration: none;
      font-weight: 800;
    }
    .credit {
      margin: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,.68);
    }
    .credit a { color: rgba(255,255,255,.92); }

    @media (max-width: 700px) {
      .page { padding: 28px 14px 42px; background-attachment: scroll; }
      .verse-card { padding: 34px 22px; border-radius: 25px; }
      .video-card { padding: 14px; border-radius: 22px; }
      blockquote { line-height: 1.62; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <section class="verse-card">
        <p class="date">2026. 08. 04</p>
        <p class="label">TODAY'S WORD · 오늘의 말씀</p>
        <blockquote>
          그러나 나는 하나님의 집에서 자라는 푸른 잎이 무성한 올리브 나무처럼,<br>
          언제나 하나님의 한결같은 사랑만을 의지하련다.<br>
          주님께서 하신 일을 생각하며, 주님을 영원히 찬양하렵니다.<br>
          주님을 믿는 성도들 앞에서, 선하신 주님의 이름을 우러러 기리렵니다.
        </blockquote>
        <div class="reference">시편 52:8-9</div>
      </section>

      <section class="video-card">
        <h2 class="video-heading">▶ 말씀과 함께 영상 보기</h2>
        <p class="video-title">나는 믿네 Trust In God · 스캇 브래너 &amp; 리바이츠</p>

        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/Io4a_IyhX-A?rel=0&amp;playsinline=1"
            title="시편 52장 8절에서 9절 말씀 묵상 영상"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <a class="watch-button"
           href="https://www.youtube.com/watch?v=Io4a_IyhX-A"
           target="_blank"
           rel="noopener noreferrer">
          ▶ YouTube에서 바로 보기
        </a>
      </section>

      <p class="credit">
        Background photo:
        <a href="https://unsplash.com/photos/the-sun-is-shining-through-the-trees-in-the-field-Kk1bz9VwRoc"
           target="_blank" rel="noopener noreferrer">
          Sarah Harmon · Unsplash
        </a>
      </p>
    </div>
  </main>
