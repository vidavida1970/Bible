<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="의의 열매는 평화요, 의의 결실은 영원한 평안과 안전이다. — 이사야서 32:16-18" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="오늘의 말씀" />
  <meta property="og:title" content="오늘의 말씀 | 이사야서 32:16-18" />
  <meta property="og:description" content="나의 백성은 평화로운 집에서 살며, 안전한 거처와 평온히 쉴 수 있는 곳에서 살 것이다." />
  <meta property="og:url" content="https://vidavida1970.github.io/Bible/2026-07-25/" />
  <meta property="og:image" content="https://i.ytimg.com/vi/GDoarJJezi0/maxresdefault.jpg" />
  <meta property="og:image:secure_url" content="https://i.ytimg.com/vi/GDoarJJezi0/maxresdefault.jpg" />
  <meta property="og:image" content="https://i.ytimg.com/vi/GDoarJJezi0/hqdefault.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="720" />
  <meta property="og:image:alt" content="오늘의 말씀 이사야서 32장 16절부터 18절과 함께 보는 유튜브 영상 썸네일" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="오늘의 말씀 | 이사야서 32:16-18" />
  <meta name="twitter:description" content="의의 열매는 평화요, 의의 결실은 영원한 평안과 안전이다." />
  <meta name="twitter:image" content="https://i.ytimg.com/vi/GDoarJJezi0/maxresdefault.jpg" />

  <title>오늘의 말씀 | 이사야서 32:16-18</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: #263c31;
      color: #fff;
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 58px 20px 74px;
      overflow: hidden;
      background-image:
        linear-gradient(180deg, rgba(18, 35, 27, .20), rgba(15, 31, 25, .68)),
        url("https://images.pexels.com/photos/4409319/pexels-photo-4409319.jpeg?auto=compress&cs=tinysrgb&w=2000");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 72% 20%, rgba(255, 224, 166, .25), transparent 28%),
        linear-gradient(180deg, rgba(5, 18, 14, .04), rgba(5, 18, 14, .32));
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      display: grid;
      gap: 28px;
    }

    .verse-card {
      padding: clamp(36px, 6vw, 72px);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(22, 49, 38, .78), rgba(37, 51, 42, .50));
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: 0 30px 90px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
    }

    .label {
      margin: 0 0 24px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .22em;
      color: #f7dda1;
    }

    blockquote {
      margin: 0;
      font-family: "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: clamp(23px, 4vw, 42px);
      line-height: 1.7;
      font-weight: 700;
      letter-spacing: -.04em;
      word-break: keep-all;
      text-shadow: 0 4px 22px rgba(0,0,0,.68);
    }

    .reference {
      margin-top: 28px;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 800;
      color: rgba(255,255,255,.96);
    }

    .video-card {
      padding: 22px;
      border-radius: 28px;
      background: rgba(17, 39, 31, .86);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 24px 70px rgba(0,0,0,.30);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .video-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 800;
    }

    .play {
      width: 31px;
      height: 31px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #2d4838;
      font-size: 12px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255,255,255,.76);
    }

    .watch-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      min-height: 46px;
      padding: 0 19px;
      border-radius: 999px;
      background: #fff;
      color: #2d4838;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .credit {
      margin: 2px auto 0;
      color: rgba(255,255,255,.76);
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .credit a { color: rgba(255,255,255,.94); }

    @media (max-width: 700px) {
      .hero {
        padding: 28px 14px 42px;
        background-attachment: scroll;
        background-position: 58% center;
      }
      .container { gap: 18px; }
      .verse-card { padding: 34px 22px; border-radius: 25px; }
      blockquote { line-height: 1.62; }
      .video-card { padding: 14px; border-radius: 22px; }
      .video-wrap { border-radius: 15px; }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="container">
      <section class="verse-card" aria-label="오늘의 말씀">
        <p class="label">TODAY'S WORD · 오늘의 말씀</p>
        <blockquote>
          “그 때에는, 광야에 공평이 자리잡고,<br>
          기름진 땅에 의가 머물 것이다.<br><br>
          의의 열매는 평화요,<br>
          의의 결실은 영원한 평안과 안전이다.<br><br>
          나의 백성은 평화로운 집에서 살며,<br>
          안전한 거처, 평온히 쉴 수 있는 곳에서 살 것이다.”
        </blockquote>
        <div class="reference">이사야서 32:16-18</div>
      </section>

      <section class="video-card" aria-label="말씀 묵상 영상">
        <h2 class="video-title"><span class="play">▶</span>말씀과 함께 영상 보기</h2>
        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/GDoarJJezi0?rel=0&playsinline=1"
            title="이사야서 32장 16절에서 18절 말씀 묵상 영상"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
        <p class="fallback">브라우저 환경에 따라 영상 재생이 제한될 경우 아래 버튼으로 바로 시청할 수 있습니다.</p>
        <a class="watch-button" href="https://youtu.be/GDoarJJezi0" target="_blank" rel="noopener noreferrer">▶ YouTube에서 바로 보기</a>
      </section>

      <p class="credit">
        Background photo:
        <a href="https://www.pexels.com/photo/sunset-over-grassy-field-and-rural-cottage-4409319/" target="_blank" rel="noopener noreferrer">Helena Lopes / Pexels</a>
      </p>
    </div>
  </main>
</body>
</html>
