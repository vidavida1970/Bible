<body><main class="box"><h1>오늘의 말씀</h1><p>“내 아이들아, 꿀을 먹어라. 그것은 좋은 것이다. 송이꿀을 먹어라. 그것은 너의 입에 달콤할 것이다.<br><br>지혜도 너의 영혼에게는 그와 같다는 것을 알아라. 그것을 얻으면 너의 장래가 밝아지고, 너의 소망이 끊어지지 않는다.”</p><p><strong>잠언 24:13-14</strong></p><a href="https://vidavida1970.github.io/Bible/2026-08-07/">말씀과 영상 보기</a></main></body>
