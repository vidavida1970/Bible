name: Publish 2026-11-02 Bible Verse Assets
on:
  push:
    paths:
      - '2026-11-02/build_assets.py'
      - '.github/workflows/publish-verse-20261102.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "bible-assets-20261102"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bible main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          python -m pip install --quiet pillow
      - name: Generate backdrop and 1200x630 Kakao thumbnails
        run: python 2026-11-02/build_assets.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-02/bg.jpg 2026-11-02/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Add November 2 John 14:16-18 background and Kakao thumbnail assets'
            git push
          fi
