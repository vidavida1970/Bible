name: Publish 2026-11-01 Bible Verse Assets
on:
  push:
    paths:
      - '2026-11-01/build_assets.py'
      - '.github/workflows/publish-verse-20261101.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bible repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          python -m pip install --quiet pillow
      - name: Render verse backdrop and 1200x630 share images
        run: python 2026-11-01/build_assets.py
      - name: Commit finished image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-01/bg.jpg 2026-11-01/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish November 1 shepherd verse background and Kakao thumbnails'
            git push
          fi
