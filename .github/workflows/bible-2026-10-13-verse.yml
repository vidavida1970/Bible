name: Build Bible Verse Assets 2026-10-13
on:
  push:
    branches: [main]
    paths:
      - '2026-10-13/verse/*.html'
      - '2026-10-13/verse/build_assets.py'
      - '.github/workflows/bible-2026-10-13/verse.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bible-assets-2026-10-13/verse
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries and Korean fonts
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
      - name: Render and validate verse image assets
        run: python 2026-10-13/verse/build_assets.py
      - name: Commit images to repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2026-10-13/verse/bg.jpg 2026-10-13/verse/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add 2026-10-13/verse Bible verse background and Kakao thumbnails"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site content
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
