name: Build Bible Verse Assets 2026-10-29
on:
  push:
    branches: [main]
    paths:
      - '2026-10-29/index.html'
      - '2026-10-29/kakao-v1.html'
      - '2026-10-29/kakao-v2.html'
      - '2026-10-29/build_assets.py'
      - '.github/workflows/bible-2026-10-29.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-assets-2026-10-29
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library and Korean fonts
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
      - name: Render background and Kakao previews
        run: python 2026-10-29/build_assets.py
      - name: Commit generated image assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2026-10-29/bg.jpg 2026-10-29/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Render Matthew 5:14-16 golden village and Kakao thumbnails"
            git push
          fi
