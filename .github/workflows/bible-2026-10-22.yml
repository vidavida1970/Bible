name: Build Bible Verse Assets 2026-10-22
on:
  push:
    branches: [main]
    paths:
      - '2026-10-22/index.html'
      - '2026-10-22/kakao-v1.html'
      - '2026-10-22/kakao-v2.html'
      - '2026-10-22/build_assets.py'
      - '.github/workflows/bible-2026-10-22.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-assets-2026-10-22
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and Korean fonts
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
      - name: Build background and Kakao thumbnails
        run: python 2026-10-22/build_assets.py
      - name: Commit generated image assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2026-10-22/bg.jpg 2026-10-22/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Render Psalm 131:1-3 restful lake and Kakao thumbnails"
            git push
          fi
