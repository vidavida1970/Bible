name: Build Bible Verse Assets 2026-10-25
on:
  push:
    branches: [main]
    paths:
      - '2026-10-25/index.html'
      - '2026-10-25/kakao-v1.html'
      - '2026-10-25/kakao-v2.html'
      - '2026-10-25/build_assets.py'
      - '.github/workflows/bible-2026-10-25.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-assets-2026-10-25
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PIL and Korean fonts
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
      - name: Render verse backgrounds and Kakao share images
        run: python 2026-10-25/build_assets.py
      - name: Commit imagery to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2026-10-25/bg.jpg 2026-10-25/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Render Colossians 2:6-7 2026-10-25 faith roots and Kakao thumbnails"
            git push
          fi
