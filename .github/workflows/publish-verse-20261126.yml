name: Publish 2026-11-26 Bible Verse Assets
on:
  push:
    paths:
      - '2026-11-26/build_assets.py'
      - '.github/workflows/publish-verse-20261126.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-assets-20261126
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install CJK fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow
      - name: Render background and Kakao previews
        run: python 2026-11-26/build_assets.py
      - name: Commit and publish generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-26/bg.jpg 2026-11-26/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Psalm 16:8–11 background and Kakao thumbnails'
            git push
          fi
