name: Publish 2026-11-10 Bible Verse Assets
on:
  push:
    paths:
      - '2026-11-10/build_assets.py'
      - '.github/workflows/publish-verse-20261110.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "bible-assets-20261110"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          python -m pip install --quiet pillow
      - name: Render background and Kakao previews
        run: python 2026-11-10/build_assets.py
      - name: Publish generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-10/bg.jpg 2026-11-10/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish November 10 Luke 15 background and Korean previews'
            git push
          fi
