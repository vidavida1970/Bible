name: Build Bible Verse Assets 2026-10-14
on:
  push:
    branches: [main]
    paths:
      - '2026-10-14/index.html'
      - '2026-10-14/kakao-v1.html'
      - '2026-10-14/kakao-v2.html'
      - '2026-10-14/build_assets.py'
      - '.github/workflows/bible-2026-10-14.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-thumbnails-2026-10-14
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and Korean fonts
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
      - name: Render backgrounds and thumbnails
        run: python 2026-10-14/build_assets.py
      - name: Commit image assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2026-10-14/bg.jpg 2026-10-14/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Render Jeremiah 9:24 responsive background and Kakao thumbnails"
            git push
          fi
