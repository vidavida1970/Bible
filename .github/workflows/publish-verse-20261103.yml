name: Publish 2026-11-03 Bible Verse Assets
on:
  push:
    paths:
      - '2026-11-03/build_assets.py'
      - '.github/workflows/publish-verse-20261103.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "bible-assets-20261103"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Noto Korean fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum
          python -m pip install --quiet pillow
      - name: Generate Psalm 143 thumbnails and backgrounds
        run: python 2026-11-03/build_assets.py
      - name: Commit image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-11-03/bg.jpg 2026-11-03/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish November 3 Psalm 143 background and Kakao previews'
            git push
          fi
